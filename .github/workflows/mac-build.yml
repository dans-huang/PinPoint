name: Unsigned app builds

on:
  push:
    paths:
      - "App/**"
      - "Shared/**"
      - "Config/**"
      - "PublicBackend/**"
      - "Tests/**"
      - "docs/**"
      - "README.md"
      - "scripts/build.sh"
      - "scripts/bootstrap-sdk.sh"
      - "project.yml"
      - ".github/workflows/mac-build.yml"
  pull_request:
    paths:
      - "App/**"
      - "Shared/**"
      - "Config/**"
      - "PublicBackend/**"
      - "Tests/**"
      - "docs/**"
      - "README.md"
      - "scripts/build.sh"
      - "scripts/bootstrap-sdk.sh"
      - "project.yml"
      - ".github/workflows/mac-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Self-hosted and hosted compile checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: PublicBackend/requirements.txt
      - name: Install contract-test dependency
        run: python -m pip install pyyaml
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile self-hosted app without signing
        run: scripts/build.sh --ios
      - name: Compile hosted app without signing
        run: scripts/build.sh --hosted --ios
      - name: Run app and repository contracts on macOS
        run: python -m unittest discover -s Tests -v
