name: Unsigned app builds

on:
  push:
    paths:
      - "App/**"
      - "Shared/**"
      - "Config/**"
      - "scripts/build.sh"
      - "scripts/bootstrap-sdk.sh"
      - "project.yml"
      - ".github/workflows/mac-build.yml"
  pull_request:
    paths:
      - "App/**"
      - "Shared/**"
      - "Config/**"
      - "scripts/build.sh"
      - "scripts/bootstrap-sdk.sh"
      - "project.yml"
      - ".github/workflows/mac-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Self-hosted and hosted compile checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Compile self-hosted app without signing
        run: scripts/build.sh --ios
      - name: Compile hosted app without signing
        run: scripts/build.sh --hosted --ios
